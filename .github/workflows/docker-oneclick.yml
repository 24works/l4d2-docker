name: One-Click Build and Push Docker Image

on:
  # push:
  #   branches:
  #     - master
  #     - main
  #   tags:
  #     - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # runs-on: org-aliyun-sin

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image names and date tag
        id: prep
        run: |
          # GHCR 要求镜像名全小写
          echo "ghcr_image=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Docker Hub 只用 repo 名（去掉 owner）
          echo "repo_name=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"
          # 生成 YYMMDD 格式日期标签，例如 2026-10-07 -> 261007
          echo "date=$(TZ=Asia/Taipei date +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 一次构建，同时推送 Docker Hub 和 GHCR 的 latest + 日期标签
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ steps.prep.outputs.repo_name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ steps.prep.outputs.repo_name }}:${{ steps.prep.outputs.date }}
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.ghcr_image }}:latest
            ${{ env.REGISTRY }}/${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.date }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max