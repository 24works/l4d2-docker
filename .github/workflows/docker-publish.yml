name: Build and Push Docker Image

on:
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # runs-on: org-aliyun-sin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare repo name and date tag
        id: prep
        run: |
          # 从 GITHUB_REPOSITORY (owner/repo) 中取出 repo 名
          echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)" >> "$GITHUB_ENV"
          # 生成 YYMMDD 格式日期标签，例如 2026-10-07 -> 261007
          echo "DATE_TAG=$(TZ=Asia/Taipei date +'%y%m%d')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 同时推送 latest 和 YYMMDD 日期标签
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.REPO_NAME }}:${{ env.DATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max